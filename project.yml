name: HIAHDesktop
options:
  bundleIdPrefix: com.aspauldingcode
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  generateEmptyDirectories: true

schemes:
  HIAHDesktop:
    build:
      targets:
        HIAHDesktop: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HIAHKernel:
    build:
      targets:
        HIAHKernel: all
    run:
      config: Debug

settings:
  base:
    PRODUCT_NAME: HIAHDesktop
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    BUILD_LIBRARY_FOR_DISTRIBUTION: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ENABLE_BITCODE: NO
    
    # Nix store dependency paths (Rust)
    EM_PROXY_PATH: /nix/store/8y6z7a777kv0sqdsxa6259dc279xk80d-em-proxy-unstable-2025-12-29
    MINIMUXER_PATH: /nix/store/jyrjc98bk7m4hzpiy9dr7ys0x8rr5bgw-minimuxer-unstable-2025-12-29
    
    # Nix store dependency paths (Swift)
    ROXAS_PATH: /nix/store/zfrfzv0grfn43yjp961a0qmz62i0mxy4-roxas-unstable-2025-12-29
    ALTSIGN_PATH: /nix/store/yxm2na70kh2s3vghqpmcfj4189fqdv5z-altsign-spm-unstable-2025-12-29
    
    # Nix store dependency paths (C libraries - iOS Simulator)
    OPENSSL_SIM_PATH: /nix/store/m1wgizw9wp78xnr6rj9d67lpsrqc3s2f-openssl-ios-sim
    ZSIGN_SIM_PATH: /nix/store/173agfc77vg4mvqamlfz2rp121aszw3f-zsign-unstable-2025-01-15
    LIBPLIST_SIM_PATH: /nix/store/p8s5p5cghlgz2765mmykcvprm5japrxh-libplist-ios-sim
    LIBIMOBILEDEVICE_GLUE_SIM_PATH: /nix/store/4349vl9rsp0r78wgr6zvmn3nq74i8gnk-libimobiledevice-glue-ios-sim
    LIBUSBMUXD_SIM_PATH: /nix/store/371w2j662yx13c7dmhk26pn4wcv16bzk-libusbmuxd-ios-sim
    LIBIMOBILEDEVICE_SIM_PATH: /nix/store/204x42x0q67qm132iki8171n5s0rj15s-libimobiledevice-ios-sim
    
    # Nix store dependency paths (C libraries - iOS Device)
    OPENSSL_IOS_PATH: /nix/store/6gaz408d06whdrpagyfgz4p6k6ps7zz1-openssl-ios
    ZSIGN_IOS_PATH: /nix/store/c34nm5qvdldp5hasbgwa7qs9ikfgbf1q-zsign-unstable-2025-01-15
    LIBPLIST_IOS_PATH: /nix/store/ap17ci05kiavdh98w5cc8iqiz7xl751s-libplist-ios
    LIBIMOBILEDEVICE_GLUE_IOS_PATH: /nix/store/cmjzmpcrvwv1llhl65153js8gg3jklm6-libimobiledevice-glue-ios
    LIBUSBMUXD_IOS_PATH: /nix/store/sykj4r42bibjcbssc7wgfjimb0sgqk45-libusbmuxd-ios
    LIBIMOBILEDEVICE_IOS_PATH: /nix/store/r67v2kj3armw5ld82idlygr82wn6hmq4-libimobiledevice-ios

  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_COMPILATION_MODE: incremental

    Release:
      ONLY_ACTIVE_ARCH: NO
      SWIFT_OPTIMIZATION_LEVEL: -Osize
      SWIFT_WHOLE_MODULE_OPTIMIZATION: YES
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES

targets:
  HIAHKernel:
    type: framework
    platform: iOS
    info:
      path: src/HIAHKernel/Info.plist
    dependencies:
      - framework: Security.framework
      - framework: Foundation.framework
    sources:
      - path: src/HIAHKernel/Public
        headerVisibility: public
      - path: src/HIAHKernel/Core
        headerVisibility: project
    settings:
      PRODUCT_NAME: HIAHKernel
      PRODUCT_BUNDLE_IDENTIFIER: com.aspauldingcode.HIAHKernel
      SKIP_INSTALL: YES
      MACH_O_TYPE: mh_dylib
      DEFINES_MODULE: NO
      CLANG_ENABLE_MODULES: NO
      CLANG_CXX_LANGUAGE_STANDARD: c++17
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/src/HIAHKernel/Public
        - $(SRCROOT)/src/HIAHKernel/Core
        - $(SRCROOT)/src/HIAHKernel/Core/Hooks
        - $(SRCROOT)/src/HIAHKernel/Core/Logging
        - $(SRCROOT)/src/HIAHKernel/Core/Utils
        - $(SRCROOT)/src/HIAHKernel/Core/Signing
        - /nix/store/m1wgizw9wp78xnr6rj9d67lpsrqc3s2f-openssl-ios-sim/include
        - /nix/store/173agfc77vg4mvqamlfz2rp121aszw3f-zsign-unstable-2025-01-15/include
        - /nix/store/173agfc77vg4mvqamlfz2rp121aszw3f-zsign-unstable-2025-01-15/include/zsign
        - /nix/store/173agfc77vg4mvqamlfz2rp121aszw3f-zsign-unstable-2025-01-15/include/zsign/common
        - /nix/store/p8s5p5cghlgz2765mmykcvprm5japrxh-libplist-ios-sim/include
        - /nix/store/4349vl9rsp0r78wgr6zvmn3nq74i8gnk-libimobiledevice-glue-ios-sim/include
        - /nix/store/371w2j662yx13c7dmhk26pn4wcv16bzk-libusbmuxd-ios-sim/include
        - /nix/store/204x42x0q67qm132iki8171n5s0rj15s-libimobiledevice-ios-sim/include
      LIBRARY_SEARCH_PATHS:
        - /nix/store/m1wgizw9wp78xnr6rj9d67lpsrqc3s2f-openssl-ios-sim/lib
        - /nix/store/173agfc77vg4mvqamlfz2rp121aszw3f-zsign-unstable-2025-01-15/lib
        - /nix/store/p8s5p5cghlgz2765mmykcvprm5japrxh-libplist-ios-sim/lib
        - /nix/store/4349vl9rsp0r78wgr6zvmn3nq74i8gnk-libimobiledevice-glue-ios-sim/lib
        - /nix/store/371w2j662yx13c7dmhk26pn4wcv16bzk-libusbmuxd-ios-sim/lib
        - /nix/store/204x42x0q67qm132iki8171n5s0rj15s-libimobiledevice-ios-sim/lib
      OTHER_LDFLAGS:
        - -lzsign
        - -lssl
        - -lcrypto
        - -lc++

  HIAHProcessRunner:
    type: app-extension
    platform: iOS
    info:
      path: src/extension/Info.plist
    dependencies:
      - target: HIAHKernel
        embed: false
        link: true
      - framework: Security.framework
      - framework: Foundation.framework
    sources:
      - path: src/extension
        excludes:
          - "*.plist"
      - path: src/HIAHKernel/Public
      - path: src/HIAHKernel/Core
      - path: src/TestSupport
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aspauldingcode.HIAHDesktop.HIAHProcessRunner
      ENABLE_BITCODE: NO
      CODE_SIGN_ENTITLEMENTS: src/extension/Entitlements.plist
      CLANG_ENABLE_MODULES: NO
      CLANG_CXX_LANGUAGE_STANDARD: c++17
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/src/HIAHKernel/Public
        - $(SRCROOT)/src/HIAHKernel/Core
        - $(SRCROOT)/src/HIAHKernel/Core/Hooks
        - $(SRCROOT)/src/HIAHKernel/Core/Signing
        - $(SRCROOT)/src/HIAHKernel/Core/Utils
        - $(SRCROOT)/src/HIAHKernel/Core/Logging
        - $(SRCROOT)/src/TestSupport
        - /nix/store/173agfc77vg4mvqamlfz2rp121aszw3f-zsign-unstable-2025-01-15/include
        - /nix/store/173agfc77vg4mvqamlfz2rp121aszw3f-zsign-unstable-2025-01-15/include/zsign
        - /nix/store/173agfc77vg4mvqamlfz2rp121aszw3f-zsign-unstable-2025-01-15/include/zsign/common
        - /nix/store/m1wgizw9wp78xnr6rj9d67lpsrqc3s2f-openssl-ios-sim/include
      LIBRARY_SEARCH_PATHS:
        - /nix/store/173agfc77vg4mvqamlfz2rp121aszw3f-zsign-unstable-2025-01-15/lib
        - /nix/store/m1wgizw9wp78xnr6rj9d67lpsrqc3s2f-openssl-ios-sim/lib
      OTHER_LDFLAGS:
        - -lzsign
        - -lssl
        - -lcrypto
        - -lc++

  HIAHDesktop:
    type: application
    platform: iOS
    info:
      path: src/HIAHDesktop/Info.plist
    dependencies:
      - target: HIAHKernel
        embed: true
        link: true
      - target: HIAHProcessRunner
        embed: true
      - framework: UIKit.framework
      - framework: Foundation.framework
      - framework: CoreGraphics.framework
    sources:
      - path: src/HIAHDesktop
      - path: src/Config
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aspauldingcode.HIAHDesktop
      CODE_SIGN_ENTITLEMENTS: src/HIAHDesktop/HIAHDesktop.entitlements
      CLANG_ENABLE_MODULES: NO
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/src/HIAHKernel/Public
        - $(SRCROOT)/src/Config

  HIAHTop:
    type: application
    platform: iOS
    info:
      path: src/HIAHTop/Info.plist
    dependencies:
      - target: HIAHKernel
        embed: true
        link: true
      - framework: UIKit.framework
      - framework: Foundation.framework
      - framework: CoreGraphics.framework
    sources:
      - path: src/HIAHTop
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aspauldingcode.HIAHTop
      CLANG_ENABLE_MODULES: NO
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/src/HIAHKernel/Public
